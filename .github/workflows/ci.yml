name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types, translations and unit tests. Needs no database.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm test

  # The real thing in a real browser: a clerk, a doctor, a TV board and a patient's phone.
  e2e:
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: queuecare
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: queuecare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queuecare -d queuecare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://queuecare:ci-password@localhost:5432/queuecare
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      APP_URL: http://localhost:3000
      DISPLAY_KEY: ci-display-key-1234
      RETENTION_DAYS: "90"
      DISABLE_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run build
      - name: Start the app
        run: |
          npm start > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:3000/api/health > /dev/null && exit 0
            sleep 2
          done
          cat app.log
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            app.log
          retention-days: 7

  # The image builds, and the compose file is valid.
  docker:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docker-compose.yml
        # The compose file reads .env, exactly as a new user creates it from .env.example.
        run: |
          cp .env.example .env
          docker compose config --quiet
        env:
          BACKUP_PASSPHRASE: ci-only
      - uses: docker/setup-buildx-action@v3
      - name: Build the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: queuecare:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backup/Dockerfile
          push: false
          tags: queuecare-backup:ci
